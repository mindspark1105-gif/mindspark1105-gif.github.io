<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Mindspark Apps</title>
<meta name="description" content="Apps by Mindspark: Daynora habit tracker, Memory Quest card match game and Hush call blocking (beta).">
<meta name="theme-color" content="#0a0a0e">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔥</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    min-height: 100vh;
    min-height: 100dvh;
    background: #0a0a0e;
    color: #fff;
    font-family: 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 56px 20px 40px;
    text-align: center;
    overflow-x: hidden;
    position: relative;
  }
  .glow {
    position: fixed;
    border-radius: 50%;
    filter: blur(90px);
    pointer-events: none;
    z-index: 0;
  }
  .glow.top {
    width: 420px; height: 420px;
    top: -180px; left: 50%;
    transform: translateX(-50%);
    background: radial-gradient(circle, rgba(255,122,26,0.32), transparent 65%);
  }
  .glow.bottom {
    width: 360px; height: 360px;
    bottom: -200px; left: 50%;
    transform: translateX(-50%);
    background: radial-gradient(circle, rgba(255,60,120,0.12), transparent 65%);
  }
  main { position: relative; z-index: 1; width: 100%; max-width: 400px; }
  .flame {
    font-size: 64px;
    line-height: 1;
    filter: drop-shadow(0 0 26px rgba(255,122,26,0.8)) drop-shadow(0 0 60px rgba(255,122,26,0.35));
    animation: flicker 2.6s ease-in-out infinite;
    display: inline-block;
  }
  @keyframes flicker {
    0%, 100% { transform: scale(1) rotate(-1.5deg); }
    50% { transform: scale(1.07) rotate(1.5deg); }
  }
  h1 {
    margin-top: 16px;
    font-size: 34px;
    font-weight: 900;
    letter-spacing: 0.2px;
    background: linear-gradient(180deg, #fff 30%, rgba(255,200,160,0.85));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .tag {
    margin-top: 8px;
    font-size: 15px;
    font-weight: 700;
    color: rgba(255,255,255,0.5);
    letter-spacing: 0.3px;
  }
  .apps { margin-top: 38px; display: flex; flex-direction: column; gap: 14px; }
  a.card {
    display: flex;
    align-items: center;
    gap: 16px;
    text-align: left;
    text-decoration: none;
    color: #fff;
    background: linear-gradient(160deg, rgba(255,255,255,0.07), rgba(255,255,255,0.02));
    border: 1px solid rgba(255,138,60,0.35);
    border-radius: 22px;
    padding: 18px 20px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.45), 0 0 28px rgba(255,122,26,0.10), inset 0 1px 0 rgba(255,255,255,0.08);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
    animation: rise 0.6s cubic-bezier(0.2, 0.8, 0.3, 1) backwards;
  }
  a.card:nth-child(2) { animation-delay: 0.12s; }
  a.card:nth-child(3) { animation-delay: 0.24s; }
  @keyframes rise {
    from { opacity: 0; transform: translateY(18px); }
    to { opacity: 1; transform: translateY(0); }
  }
  a.card:hover { border-color: rgba(255,150,70,0.7); box-shadow: 0 10px 36px rgba(0,0,0,0.5), 0 0 40px rgba(255,122,26,0.2), inset 0 1px 0 rgba(255,255,255,0.1); }
  a.card:active { transform: scale(0.975); }
  a.card img {
    width: 56px; height: 56px;
    border-radius: 15px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.08);
    flex-shrink: 0;
  }
  a.card .ic {
    width: 56px; height: 56px;
    border-radius: 15px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.08);
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 29px; line-height: 1;
    background: linear-gradient(160deg, #3d4166, #171a2b);
  }
  .beta {
    display: inline-block;
    margin-left: 8px;
    padding: 2.5px 8px 1.5px;
    border-radius: 999px;
    font-size: 9.5px;
    font-weight: 900;
    letter-spacing: 1.2px;
    color: #ffb26b;
    background: rgba(255,140,58,0.14);
    border: 1px solid rgba(255,150,70,0.45);
    vertical-align: 4px;
  }
  a.card .txt { flex: 1; min-width: 0; }
  a.card .name { font-size: 19px; font-weight: 900; letter-spacing: 0.2px; }
  a.card .sub { font-size: 13.5px; font-weight: 700; color: rgba(255,255,255,0.55); margin-top: 3px; line-height: 1.35; }
  a.card .go {
    flex-shrink: 0;
    width: 34px; height: 34px;
    border-radius: 50%;
    background: linear-gradient(160deg, #ff8c3a, #ff5e1a);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 14px rgba(255,110,30,0.45);
  }
  a.card .go svg { width: 16px; height: 16px; fill: #fff; }
  .play {
    margin-top: 26px;
    font-size: 12.5px;
    font-weight: 800;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.35);
    animation: rise 0.6s 0.36s cubic-bezier(0.2, 0.8, 0.3, 1) backwards;
  }
  .foot {
    margin-top: 14px;
    font-size: 13px;
    font-weight: 700;
    color: rgba(255,255,255,0.3);
    animation: rise 0.6s 0.44s cubic-bezier(0.2, 0.8, 0.3, 1) backwards;
  }
  .foot b { color: rgba(255,160,90,0.75); font-weight: 800; }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
